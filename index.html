<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 協作教學作品集</title>
<meta name="description" content="與 AI 協作做出來的教學工具，依備課、上課、評量三階段整理，點一下就能打開使用。">
<style>
:root {
  --bg: #0e1318;
  --surface: #161e26;
  --surface-2: #1c2630;
  --line: #2a3542;
  --text: #f3f5f7;
  --text-2: #c6cfd8;
  --text-3: #93a0ad;
  --prep: #f5b84a;
  --teach: #5cc8ff;
  --assess: #ff7aa8;
  --stage: var(--text);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 19px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* 頂部導覽 */
header.top {
  position: sticky; top: 0; z-index: 5;
  background: rgba(14, 19, 24, .92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 24px; height: 68px; }
header.top .brand { font-weight: 800; font-size: 20px; text-decoration: none; white-space: nowrap; }
header.top nav { display: flex; gap: 8px; margin-left: auto; }
header.top nav a {
  text-decoration: none; font-weight: 700; font-size: 17px;
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--c);
}
header.top nav a:hover { background: var(--surface-2); }

/* 首屏 */
.hero { padding: 88px 0 56px; }
.hero h1 { font-size: clamp(40px, 6vw, 72px); line-height: 1.2; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--teach); }
.hero p.lead { font-size: clamp(19px, 2.2vw, 24px); color: var(--text-2); margin-top: 22px; max-width: 760px; }
.stats { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
.stats div {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 22px; color: var(--text-2); font-size: 17px;
}
.stats b { color: var(--text); font-size: 30px; margin-right: 6px; }

/* 分段 */
section.stage { padding: 56px 0 24px; }
section.stage[data-stage="prep"]   { --stage: var(--prep); }
section.stage[data-stage="teach"]  { --stage: var(--teach); }
section.stage[data-stage="assess"] { --stage: var(--assess); }
.stage-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 30px; }
.stage-head .num { font-size: 56px; font-weight: 800; color: var(--stage); line-height: 1; }
.stage-head h2 { font-size: 40px; font-weight: 800; }
.stage-head p { flex-basis: 100%; color: var(--text-2); font-size: 20px; }

/* 作品卡 */
.work {
  display: grid; grid-template-columns: 1.25fr 1fr; gap: 36px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 28px; margin-bottom: 28px;
}
.work:nth-of-type(even) .media { order: 2; }
.media {
  display: block; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: #000; aspect-ratio: 16 / 9; position: relative;
}
.media img, .media video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.media video { object-fit: contain; }
a.media { transition: transform .15s, border-color .15s; }
a.media:hover { transform: translateY(-3px); border-color: var(--stage); }
.media.placeholder {
  display: grid; place-items: center; background: var(--surface-2);
  color: var(--text-3); font-size: 18px; text-align: center; padding: 24px;
}
.media.placeholder b { display: block; font-size: 26px; color: var(--text-2); margin-bottom: 8px; }

.info .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.info .tags span {
  font-size: 15px; font-weight: 700; color: var(--stage);
  border: 1px solid var(--stage); border-radius: 999px; padding: 2px 12px;
}
.info .tags span.private { color: var(--text-3); border-color: var(--text-3); }
.info h3 { font-size: 32px; line-height: 1.3; font-weight: 800; margin-bottom: 6px; }
.info .tagline { font-size: 20px; color: var(--text); font-weight: 600; margin-bottom: 14px; }
.info p.desc { color: var(--text-2); }
.info .how {
  margin-top: 16px; padding: 12px 16px; border-left: 4px solid var(--stage);
  background: var(--surface-2); border-radius: 0 10px 10px 0;
  font-size: 17px; color: var(--text-2);
}
.info .how b { color: var(--text); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.actions a {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font-weight: 800; font-size: 18px; padding: 12px 22px; border-radius: 12px;
  background: var(--stage); color: var(--bg);
}
.actions a.secondary { background: transparent; color: var(--stage); border: 2px solid var(--stage); }
.actions a:hover { filter: brightness(1.1); }
.actions .note { font-size: 16px; color: var(--text-3); align-self: center; }

footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 36px 0 56px; color: var(--text-3); font-size: 16px; }

@media (max-width: 820px) {
  header.top .brand { display: none; }
  header.top nav { margin: 0 auto; }
  .hero { padding: 56px 0 32px; }
  .work { grid-template-columns: 1fr; gap: 22px; padding: 18px; }
  .work:nth-of-type(even) .media { order: 0; }
  .info h3 { font-size: 27px; }
  .stage-head h2 { font-size: 32px; }
  .stage-head .num { font-size: 44px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#">AI 協作教學作品集</a>
    <nav>
      <a href="#prep" style="--c: var(--prep)">備課</a>
      <a href="#teach" style="--c: var(--teach)">上課</a>
      <a href="#assess" style="--c: var(--assess)">評量</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>和 AI 一起做的<br><em>教學工具</em></h1>
    <p class="lead">從備課、上課到評量，每一件都在國中課堂實際用過或準備要用。有網址的點一下就能打開，不用安裝、不用登入。</p>
    <div class="stats">
      <div><b>13</b>件作品</div>
      <div><b>9</b>個網址直接開</div>
      <div><b>2026</b>年 8 月起陸續完成</div>
    </div>
  </div>

  <section class="stage" id="prep" data-stage="prep">
    <div class="stage-head"><span class="num">01</span><h2>備課</h2><p>老師先用 AI 把教材做出來：短片、3D 教具、整堂課的流程網頁。</p></div>
    <div data-list="prep"></div>
  </section>

  <section class="stage" id="teach" data-stage="teach">
    <div class="stage-head"><span class="num">02</span><h2>上課</h2><p>給學生動手用的遊戲與工具，也教他們怎麼跟 AI 講話。</p></div>
    <div data-list="teach"></div>
  </section>

  <section class="stage" id="assess" data-stage="assess">
    <div class="stage-head"><span class="num">03</span><h2>評量</h2><p>收成績、同儕互評、把錯題交給 AI 分析。</p></div>
    <div data-list="assess"></div>
  </section>
</main>

<footer>
  <div class="wrap">所有作品皆與 AI 協作完成，程式多由 AI 撰寫，教學設計與規則由老師決定。截圖攝於 2026 年 10 月。</div>
</footer>

<script>
// 作品資料：新增或修改作品只要改這裡
var WORKS = [
  { stage: 'prep', title: '再五分鐘', tagline: '流程圖單元的開場短片',
    tags: ['七年級', '資訊科技'],
    desc: '阿凱玩一場「7:30 前進校門」的上學遊戲：第一輪遲到，讀檔重來後準時到校。接著兩條上學路線變成一張流程圖，最後留一題：「媽媽不在，要改哪一格，他才起得來？」片長 2 分 41 秒。',
    how: '用程式把每一格畫面算出來（Remotion），8-bit 音效也是程式合成，台詞先用 macOS 內建語音配。',
    video: 'media/zai-wu-fen-zhong.mp4', poster: 'shots-web/zai-wu-fen-zhong.jpg' },

  { stage: 'prep', title: '逆風工坊', tagline: '逆風前行車 3D 拆解教具',
    tags: ['生活科技', '3D 模型'],
    desc: '拖曳旋轉、縮放，一鍵整組拆解與還原。點底盤、支架或傳動組會聚焦，其他零件變半透明，看清楚兩次轉向傳動。',
    how: '從實際組裝的 STL 檔修正貼合面，再用 Three.js 做成網頁。網頁上註明齒輪與葉片是教學示意，未經工程驗證。',
    shot: 'wind-car-workshop.jpg', url: 'https://peicheng0413.github.io/wind-car-workshop/' },

  { stage: 'prep', title: '空氣過濾轉盤', tagline: '把整堂小組報告課做成一台 iPad',
    tags: ['生活科技', 'iPad', '1–4 人分組'],
    desc: '開始、轉盤、討論、投影片、上台五個分頁照上課順序排。轉盤抽出家電後，用 5W1H 討論、大標檢查器做投影片，最後一分鐘計時上台。',
    how: '以 Canva 微調過的投影片模板為準，所有設計決定寫在說明文件裡，AI 下次修改就不會改回去。',
    shot: 'air-filter-wheel.jpg', url: 'https://peicheng0413.github.io/air-filter-wheel/' },

  { stage: 'prep', title: '元件圖鑑', tagline: '講不出名字的東西，AI 只能用猜的',
    tags: ['教師增能', '做網站必備'],
    desc: '滑鼠移到示範網站的任何地方，就告訴你那塊叫什麼：中文、英文，還有一句可以直接貼給 AI 的說法。收錄 52 個常見介面元件，用口語也搜得到，例如搜「跳出來的視窗」。',
    how: '給會用 AI 做網站、但講不出 header、modal 的老師。先學會描述，AI 才能一次改對。',
    shot: 'ui-element-explorer.jpg', url: 'https://peicheng0413.github.io/ui-element-explorer/' },

  { stage: 'teach', title: '提示詞排版台', tagline: '拖字塊，學會一句好提示詞的結構',
    tags: ['國中', '跨科', 'AI 素養'],
    desc: '把關鍵字字塊拖進句子的凹槽，同時排出中文和英文指令。分圖片、影片、文字、網頁小遊戲四種，圖片還有大頭貼、空氣過濾家電、塔羅風卡牌三個主題。',
    how: '主角＋特徵＋穿著＋表情＋風格＋背景＋構圖＋色調：教的是句子骨架，不是給學生一句咒語。',
    shot: 'prompt-blocks.jpg', url: 'https://peicheng0413.github.io/prompt-blocks/' },

  { stage: 'teach', title: '手勢音效板', tagline: '比個手勢，來點聲音',
    tags: ['課堂氣氛', '影像辨識'],
    desc: '對著鏡頭比讚、勝利、握拳就播音效，左右手可以設不同聲音，切到 Canva 等其他分頁也會繼續偵測，按空白鍵暫停。',
    how: '用 MediaPipe 在瀏覽器裡辨識手勢，影像只在這台電腦上處理，不會上傳。',
    shot: 'gesture-sound.jpg', url: 'https://peicheng0413.github.io/gesture-sound/' },

  { stage: 'teach', title: '手勢打鴨子', tagline: '右手瞄準，左手捏一下開槍',
    tags: ['課堂活動', '影像辨識'],
    desc: '右手食指指向螢幕當準心，左手拇指與食指捏合就開槍。每批鴨子 3 發子彈，一回合 10 隻。沒有攝影機也可以改用滑鼠玩。',
    how: '同樣用瀏覽器內的手勢辨識，準心採用「捏合前一瞬間」的位置，手抖也不會打偏。',
    shot: 'Dunk_hunt.jpg', url: 'https://peicheng0413.github.io/Dunk_hunt/' },

  { stage: 'teach', title: '森林守望・注音魔法師', tagline: '打出魔物的注音真名，守護箭塔',
    tags: ['七年級', '鍵盤入門', '注音'],
    desc: '給剛學鍵盤的七年級學生。魔物頭上只顯示注音名字，打對就能施展中毒、石化、燃燒或混亂。一聲也要按空白鍵，聲調一個都不能少。開場有四段序章故事。',
    how: '把練打字包進故事：注音在異世界是魔法文字。卷軸字型註明來源（justfont 精靈文字體轉換器）。',
    shot: 'forest-battlefield.jpg', url: 'https://peicheng0413.github.io/forest-watch-zhuyin/' },

  { stage: 'teach', title: '迴圈生存者', tagline: '多兩格積木，火力三倍',
    tags: ['資訊科技', '迴圈', '積木程式'],
    desc: '2D 彈幕遊戲，攻擊完全由積木腳本決定，不能瞄準。單層迴圈每輪 8 發，換成巢狀迴圈變 24 發，讓學生自己撞出迴圈的價值。',
    how: '先跟 AI 討論教學定位，寫成設計決策文件：「迴圈難的不是語法，是什麼時候該用」，再從這句話倒推遊戲機制。',
    shot: 'loop-survivors.jpg', url: 'https://peicheng0413.github.io/loop-survivors/' },

  { stage: 'teach', title: '浮葉農場', tagline: '用積木寫程式，讓機器人種田',
    tags: ['資訊科技', '運算思維', 'Blockly'],
    desc: '練習頁有四關：一排幼苗、先播種再澆水、如果土壤乾裂才澆水、重複包重複。積木越少星星越多，過關後出示 QR code 給老師掃。',
    how: '兩個 AI 分工：ChatGPT 畫像素素材，Claude 寫遊戲本體，中間用一份資料檔講好每張圖的位置與尺寸。',
    shot: 'robot-farm-play.jpg', url: 'https://peicheng0413.github.io/robot-farm/practice.html', urlLabel: '開啟練習頁',
    url2: 'https://peicheng0413.github.io/robot-farm/play.html', url2Label: '農場主畫面' },

  { stage: 'assess', title: 'class-pass 過關 QR', tagline: '一位學生只掃一張，成績收進手機',
    tags: ['Android app', '免網路'],
    desc: '學生玩網頁小遊戲過關，畫面出現一張 QR code，老師用 Android 手機一個接一個掃，最後匯出 CSV 用 Excel 打開。所有關卡成績在同一張，重掃也只留最好的。',
    how: '不需要網路，成績只存在老師手機。做遊戲的老師只要加兩個 JavaScript 檔案，自己的遊戲也能出 QR。',
    shot: 'robot-farm-practice.jpg', url: 'https://github.com/PeiCheng0413/class-pass', urlLabel: '下載 app 與說明' },

  { stage: 'assess', title: '班級互評', tagline: '分組、點名、同儕互評一次完成',
    tags: ['同儕互評', '國中'], private: '校內系統，未公開',
    desc: '老師課前把學生排到桌次，上課時學生用平板掃 QR 點名，老師宣布開始後，每位學生對同組一位同學做五分量表評分。資料用來做統計分析，不拿來打成績。',
    how: '規則由老師訂：未填不等於 0 分、學生看不到自己被評的分數、身分證後六碼不存明文、轉學生封存不刪除。一共寫了 21 份決策紀錄。' },

  { stage: 'assess', title: '教檢黑板', tagline: '刷題網站，錯題可以下載給 AI 分析',
    tags: ['學習分析', '教師自用'], private: '個人使用，未公開',
    desc: '教師資格考試考古題刷題網站。答錯或自評「猜的」會進入間隔重測；錯題本可以一鍵下載成文件，內容包含各子主題答對率、每題作答次數與秒數。',
    how: '同樣的做法可以搬到學生身上：把小考錯題整理成表、去掉姓名，請 AI 找出全班共同的迷思概念。' }
];

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function card(w) {
  var media;
  if (w.video) {
    media = '<div class="media"><video controls preload="metadata" playsinline poster="' + w.poster + '" src="' + w.video + '"></video></div>';
  } else if (w.shot && w.url) {
    media = '<a class="media" href="' + w.url + '" target="_blank" rel="noopener"><img loading="lazy" src="shots-web/' + w.shot + '" alt="' + esc(w.title) + ' 畫面"></a>';
  } else {
    media = '<div class="media placeholder"><div><b>' + esc(w.title) + '</b>' + esc(w.private || '') + '</div></div>';
  }
  var tags = w.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  if (w.private) tags += '<span class="private">' + esc(w.private) + '</span>';
  var actions = '';
  if (w.url) actions += '<a href="' + w.url + '" target="_blank" rel="noopener">' + esc(w.urlLabel || '開啟網站') + ' ↗</a>';
  if (w.url2) actions += '<a class="secondary" href="' + w.url2 + '" target="_blank" rel="noopener">' + esc(w.url2Label) + ' ↗</a>';
  if (w.video) actions += '<span class="note">按播放鍵直接觀看，全螢幕看最清楚</span>';
  if (!w.url && !w.video) actions += '<span class="note">這件作品沒有公開網址</span>';
  return '<article class="work">' + media +
    '<div class="info"><div class="tags">' + tags + '</div>' +
    '<h3>' + esc(w.title) + '</h3><p class="tagline">' + esc(w.tagline) + '</p>' +
    '<p class="desc">' + esc(w.desc) + '</p>' +
    '<p class="how"><b>設計與製作：</b>' + esc(w.how) + '</p>' +
    '<div class="actions">' + actions + '</div></div></article>';
}

document.querySelectorAll('[data-list]').forEach(function (box) {
  var key = box.getAttribute('data-list');
  box.innerHTML = WORKS.filter(function (w) { return w.stage === key; }).map(card).join('');
});
</script>
</body>
</html>
